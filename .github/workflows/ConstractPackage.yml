name: Build Calamari NuGet Package

on:
  push:
    tags:
      - 'v*'      # 匹配 v1.2.3 格式
      # - '[0-9]+.[0-9]+.[0-9]+'  # 匹配 1.2.3 格式
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Clean workspace before build
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf ~/.nuget/packages

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # NUKE 需要完整的 git 历史来计算版本
          fetch-tags: true  # 确保获取所有 tags

      # 调试：显示当前 git 状态
      - name: Debug Git Info
        run: |
          echo "Current branch/tag:"
          git branch -a
          echo "---"
          echo "Recent tags:"
          git tag --list | tail -20
          echo "---"
          echo "Git describe:"
          git describe --tags --long
          echo "---"
          echo "Current commit:"
          git log -1 --oneline --decorate
      
      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      # 安装 GitVersion (NUKE 构建系统需要)
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      # 显示 GitVersion 计算的版本号
      - name: Display GitVersion Output
        run: |
          echo "NuGetVersion: ${{ steps.gitversion.outputs.nuGetVersion }}"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Major: ${{ steps.gitversion.outputs.major }}"
          echo "Minor: ${{ steps.gitversion.outputs.minor }}"
          echo "Patch: ${{ steps.gitversion.outputs.patch }}"

      # 使用项目自带的构建脚本
      - name: Build and Pack Calamari
        run: |
          chmod +x ./build.sh
          ./build.sh --target PackBinaries --configuration Release --sign-binaries false

      # 生成的包会在 artifacts 目录
      - name: List Generated Packages
        run: |
          echo "Generated packages:"
          ls -la ./artifacts/

      # 发布到 GitHub Packages
      - name: Publish to GitHub Packages
        # if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          for package in ./artifacts/*.nupkg; do
            # 跳过 symbols 包
            if [[ $package != *".symbols.nupkg" ]]; then
              echo "Publishing $package"
              dotnet nuget push "$package" \
                --api-key "${{ secrets.GITHUB_TOKEN }}" \
                --source "github" \
                --skip-duplicate
            fi
          done